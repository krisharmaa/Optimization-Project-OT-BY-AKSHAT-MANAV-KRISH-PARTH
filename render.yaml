# Render blueprint for the website's Python backend (api/server.py).
# Render dashboard -> New -> Blueprint -> pick this repository. You will be asked for the two secret values below.
services:
  - type: web
    name: clockwork-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Password of the first "admin" account (the database starts empty). Choose a strong one.
      - key: CLOCKWORK_ADMIN_PASSWORD
        sync: false
      # The deployed websites allowed to call this backend, comma-separated, e.g.
      # https://your-project.vercel.app,https://krisharmaa.github.io
      - key: CLOCKWORK_ALLOWED_ORIGINS
        sync: false
